<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EBC Badminton Court</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 1. Background Setup: Deep Black & Navy with Light Beam Ray */
        body {
            background: 
                linear-gradient(
                    225deg, 
                    rgba(254, 240, 138, 0.85) 0%,   /* Bright yellow source */
                    rgba(234, 179, 8, 0.35) 18%,    /* Golden beam */
                    rgba(254, 240, 138, 0.12) 35%,   /* Soft edge */
                    transparent 50%
                ),
                radial-gradient(
                    circle at 90% 10%, 
                    rgba(254, 240, 138, 0.6) 0%, 
                    rgba(234, 179, 8, 0.2) 25%, 
                    transparent 60%
                ),
                linear-gradient(
                    135deg, 
                    #0a192f 0%, 
                    #020617 50%, 
                    #000000 100%
                );
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 2. Form Card Styling */
        .signup-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* 3. Logo Sizing */
        .site-logo {
            height: 70px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
        }

        /* 4. Navy Blue Primary Theme Modifications */
        .btn-primary-navy {
            background-color: #0f172a;
            border: none;
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .btn-primary-navy:hover {
            background-color: #1e3a8a;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .text-navy {
            color: #0f172a !important;
        }

        .link-navy {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: 600;
        }

        .link-navy:hover {
            text-decoration: underline;
        }

        /* 5. Custom Focus Ring for Inputs */
        .form-control:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }
    </style>
</head>
<body class="py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card signup-card p-4 bg-white">
                    <div class="card-body">
                        
                        <!-- Header & Logo -->
                        <div class="text-center mb-4">
                            <img src="{{ url_for('static', filename='images/logo.png') }}" 
                                 alt="EBC Logo" 
                                 class="site-logo mb-2"
                                 onerror="this.onerror=null; this.src='/static/image/logo.png';">
                            
                            <h4 class="fw-bold text-navy mb-1">Create an Account</h4>
                            <p class="text-muted small">Join us to book court slots & shop badminton gear</p>
                        </div>

                        <!-- Backend Error Alert -->
                        {% if error %}
                            <div class="alert alert-danger alert-dismissible fade show small py-2" role="alert">
                                ⚠️ {{ error }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endif %}

                        <!-- Client-Side Warning Alert -->
                        <div id="matchError" class="alert alert-warning small py-2 d-none" role="alert">
                            ⚠️ Passwords do not match!
                        </div>

                        <!-- Registration Form -->
                        <form id="signupForm" action="{{ url_for('signup') }}" method="POST">
                            
                            <!-- Full Name Field -->
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary small">Full Name</label>
                                <input type="text" name="name" class="form-control form-control-lg fs-6" placeholder="Enter your full name" required autofocus>
                            </div>

                            <!-- Email Field -->
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary small">Email Address</label>
                                <input type="email" name="email" class="form-control form-control-lg fs-6" placeholder="Enter your email address" required>
                            </div>

                            <!-- Password Field with Toggle -->
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary small">Password</label>
                                <div class="input-group">
                                    <input type="password" id="signupPassword" name="password" class="form-control form-control-lg fs-6" placeholder="••••••••" required>
                                    <button class="btn btn-outline-secondary px-3" type="button" id="togglePassBtn">
                                        <span id="passToggleText" class="small fw-bold">Show</span>
                                    </button>
                                </div>
                            </div>

                            <!-- Confirm Password Field with Toggle -->
                            <div class="mb-4">
                                <label class="form-label fw-bold text-secondary small">Confirm Password</label>
                                <div class="input-group">
                                    <input type="password" id="confirmPassword" class="form-control form-control-lg fs-6" placeholder="••••••••" required>
                                    <button class="btn btn-outline-secondary px-3" type="button" id="toggleConfirmBtn">
                                        <span id="confirmToggleText" class="small fw-bold">Show</span>
                                    </button>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-primary-navy btn-lg w-100 fw-bold shadow-sm fs-6 py-2">Create Account</button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="small text-muted mb-0">Already have an account? <a href="{{ url_for('login') }}" class="link-navy">Sign In</a></p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const signupForm = document.getElementById('signupForm');
            const passInput = document.getElementById('signupPassword');
            const confirmInput = document.getElementById('confirmPassword');
            const matchError = document.getElementById('matchError');

            const togglePassBtn = document.getElementById('togglePassBtn');
            const passToggleText = document.getElementById('passToggleText');
            
            const toggleConfirmBtn = document.getElementById('toggleConfirmBtn');
            const confirmToggleText = document.getElementById('confirmToggleText');

            // Password Show/Hide Toggle
            togglePassBtn.addEventListener('click', function () {
                const isPass = passInput.getAttribute('type') === 'password';
                passInput.setAttribute('type', isPass ? 'text' : 'password');
                passToggleText.textContent = isPass ? 'Hide' : 'Show';
            });

            // Confirm Password Show/Hide Toggle
            toggleConfirmBtn.addEventListener('click', function () {
                const isPass = confirmInput.getAttribute('type') === 'password';
                confirmInput.setAttribute('type', isPass ? 'text' : 'password');
                confirmToggleText.textContent = isPass ? 'Hide' : 'Show';
            });

            // Validate Passwords Match Before Submit
            signupForm.addEventListener('submit', function (e) {
                if (passInput.value !== confirmInput.value) {
                    e.preventDefault();
                    matchError.classList.remove('d-none');
                    confirmInput.focus();
                } else {
                    matchError.classList.add('d-none');
                }
            });
        });
    </script>
</body>
</html>
