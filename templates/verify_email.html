<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - EBC Badminton Court</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 1. Base setup: Yellow Light Ray + Deep Navy Base */
        body {
            background: 
                linear-gradient(
                    225deg, 
                    rgba(254, 240, 138, 0.85) 0%,   /* Light ray source */
                    rgba(234, 179, 8, 0.35) 18%,    /* Golden core */
                    rgba(254, 240, 138, 0.12) 35%,   /* Soft ray edge */
                    transparent 50%                 /* Fade to dark */
                ),
                radial-gradient(
                    circle at 90% 10%, 
                    rgba(254, 240, 138, 0.6) 0%, 
                    rgba(234, 179, 8, 0.2) 25%, 
                    transparent 60%
                ),
                linear-gradient(
                    135deg, 
                    #0a192f 0%, 
                    #020617 50%, 
                    #000000 100%
                );
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 2. Card Styling */
        .verify-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* 3. Logo Sizing */
        .site-logo {
            height: 70px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
        }

        /* 4. Letter Spacing for 6-Digit Code */
        .otp-input {
            letter-spacing: 0.35em;
            font-size: 1.5rem;
        }

        /* 5. Theme Palette Overrides */
        .btn-primary-navy {
            background-color: #0f172a;
            border: none;
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .btn-primary-navy:hover {
            background-color: #1e3a8a;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .text-navy {
            color: #0f172a !important;
        }

        .link-navy {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: 600;
        }

        .link-navy:hover {
            text-decoration: underline;
        }

        /* Input focus highlighting */
        .form-control:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }
    </style>
</head>
<body class="py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card verify-card p-4 bg-white">
                    <div class="card-body text-center">
                        
                        <!-- Header & Logo -->
                        <div class="mb-3">
                            <img src="{{ url_for('static', filename='images/logo.png') }}" 
                                 alt="EBC Logo" 
                                 class="site-logo mb-2"
                                 onerror="this.onerror=null; this.src='/static/image/logo.png';">
                            <h4 class="fw-bold text-navy mb-1">Verify Your Email</h4>
                            <p class="text-muted small mb-0">A 6-digit verification code was sent to</p>
                            <strong class="text-navy small">{{ email }}</strong>
                        </div>

                        <!-- Backend Error Alert -->
                        {% if error %}
                            <div class="alert alert-danger alert-dismissible fade show small py-2 my-3" role="alert">
                                ⚠️ {{ error }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endif %}

                        <!-- Verification Form -->
                        <form action="{{ url_for('auth.verify_email') }}" method="POST" class="mt-4">
                            <div class="mb-4">
                                <label class="form-label fw-bold text-secondary small">Enter 6-Digit Code</label>
                                <input type="text" 
                                       name="code" 
                                       class="form-control form-control-lg text-center fw-bold otp-input" 
                                       placeholder="123456" 
                                       maxlength="6" 
                                       pattern="[0-9]{6}" 
                                       required 
                                       autofocus 
                                       autocomplete="off">
                            </div>

                            <button type="submit" class="btn btn-primary-navy btn-lg w-100 fw-bold shadow-sm fs-6 py-2">Verify & Complete Signup</button>
                        </form>

                        <div class="mt-4">
                            <a href="{{ url_for('auth.signup') }}" class="small link-navy">← Back to Sign Up</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
