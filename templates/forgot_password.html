<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - EBC Badminton Court</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Base background setup with Light Ray and Dark Navy/Black base */
        body {
            background: 
                linear-gradient(
                    225deg, 
                    rgba(254, 240, 138, 0.85) 0%,   /* Light ray source */
                    rgba(234, 179, 8, 0.35) 18%,    /* Golden core */
                    rgba(254, 240, 138, 0.12) 35%,   /* Ray edge */
                    transparent 50%                 /* Fade out */
                ),
                radial-gradient(
                    circle at 90% 10%, 
                    rgba(254, 240, 138, 0.6) 0%, 
                    rgba(234, 179, 8, 0.2) 25%, 
                    transparent 60%
                ),
                linear-gradient(
                    135deg, 
                    #0a192f 0%, 
                    #020617 50%, 
                    #000000 100%
                );
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Card container overrides */
        .forgot-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* Logo Sizing */
        .site-logo {
            height: 70px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
        }

        /* Theme palette overrides */
        .btn-primary-navy {
            background-color: #0f172a;
            border: none;
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .btn-primary-navy:hover {
            background-color: #1e3a8a;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .text-navy {
            color: #0f172a !important;
        }

        .link-navy {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: 600;
        }

        .link-navy:hover {
            text-decoration: underline;
        }

        /* Input focus highlighting */
        .form-control:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }
    </style>
</head>
<body class="py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card forgot-card p-4 bg-white">
                    <div class="card-body">
                        
                        <div class="text-center mb-4">
                            <img src="{{ url_for('static', filename='images/logo.png') }}" 
                                 alt="EBC Logo" 
                                 class="site-logo mb-2"
                                 onerror="this.onerror=null; this.src='/static/image/logo.png';">
                            
                            <h4 class="fw-bold text-navy mb-1">Forgot Password?</h4>
                            <p class="text-muted small">Enter your email address to receive a password reset code.</p>
                        </div>

                        {% if error %}
                            <div class="alert alert-danger alert-dismissible fade show small py-2" role="alert">
                                ⚠️ {{ error }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endif %}

                        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
                            <div class="mb-4">
                                <label class="form-label fw-bold text-secondary small">Email Address</label>
                                <input type="email" name="email" class="form-control form-control-lg fs-6" placeholder="Enter your registered email" required autofocus>
                            </div>

                            <button type="submit" class="btn btn-primary-navy btn-lg w-100 fw-bold shadow-sm fs-6 py-2">Send Reset Code</button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="small text-muted mb-0">Remembered your password? <a href="{{ url_for('auth.login') }}" class="link-navy">Sign In</a></p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
