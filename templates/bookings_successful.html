<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Submitted - EBC Badminton</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top center, #1a1e29 0%, #06080c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success-card {
            background: rgba(20, 24, 32, 0.55);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            border-radius: 18px;
            border: 1px solid rgba(212, 175, 55, 0.28);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(212, 175, 55, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 520px;
            width: 100%;
            color: #cbd5e1;
        }
        .success-icon {
            font-size: 64px;
            color: #d4af37;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.6));
        }
        h2 { color: #f1f5f9; }
        .pending-icon {
            font-size: 22px;
            color: #f4d03f;
            margin-right: 6px;
            vertical-align: middle;
        }
        .btn-gold {
            background: linear-gradient(135deg, #fff5b8 0%, #f4d03f 50%, #d4af37 100%);
            color: #000000;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            transition: all 0.3s ease;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
            color: #000000;
        }
        .btn-ghost {
            background: transparent;
            color: #cbd5e1;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px 20px;
            transition: all 0.3s ease;
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.4);
        }
        .pending-box {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.28);
            border-radius: 12px;
            padding: 14px 18px;
            margin: 22px 0;
            text-align: left;
            color: #e2e8f0;
            font-size: 0.9rem;
            line-height: 1.55;
        }
        .pending-box strong { color: #f4d03f; }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 d-flex justify-content-center">
                <div class="success-card">
                    <div class="success-icon">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>
                    <h2 class="fw-bold mb-2">Booking Submitted!</h2>
                    <p class="mb-3" style="color: #94a3b8;">
                        Your reservation (ID: <strong style="color:#f4d03f;">#{{ booking_id }}</strong>) has been received.
                    </p>

                    <div class="pending-box">
                        <i class="bi bi-hourglass-split pending-icon"></i>
                        <strong>Pending admin verification.</strong><br>
                        You can view your booking summary now. Your official receipt will be ready once an admin approves it. You'll be notified as soon as it's confirmed.
                    </div>

                    <div class="d-grid gap-2">
                        <a href="{{ url_for('bookings.view_receipt', transaction_id=booking_id) }}?type=booking" class="btn btn-gold btn-lg">
                            <i class="bi bi-receipt me-2"></i>View Booking Summary
                        </a>
                        <a href="{{ url_for('bookings.index') }}" class="btn btn-ghost btn-lg">
                            <i class="bi bi-speedometer2 me-2"></i>Back to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
