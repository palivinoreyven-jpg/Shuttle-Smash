<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - EBC Badminton</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121927;
            min-height: 100vh;
        }
        .reset-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
    <div class="card reset-card p-4 bg-white">
        <div class="card-body">
            <div class="text-center mb-4">
                <div class="display-6 fw-bold text-primary mb-1">🏸 EBC</div>
                <h5 class="fw-bold text-dark">Reset Password</h5>
                <p class="text-muted small mb-0">OTP sent to: <strong>{{ email }}</strong></p>
            </div>

            {% if error %}
                <div class="alert alert-danger alert-dismissible fade show small py-2 text-center" role="alert">
                    ⚠️ {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endif %}

            <form action="{{ url_for('reset_password') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary small">Verification Code (OTP)</label>
                    <input type="text" name="otp" class="form-control form-control-lg fs-6 text-center fw-bold" placeholder="123456" maxlength="6" required autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary small">New Password</label>
                    <input type="password" name="new_password" class="form-control form-control-lg fs-6" placeholder="••••••••" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary small">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control form-control-lg fs-6" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm fs-6">Update Password</button>
            </form>

            <div class="text-center mt-4">
                <p class="small text-muted mb-0">Back to <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Sign In</a></p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
